services:
  archipe-dock:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    image: archipela-dock
    networks:
      - traefik_frontend
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_frontend
      - traefik.http.routers.archipela-dock.entrypoints=web
      - traefik.http.routers.archipela-dock.rule=Host(`archipeluqac.otchi.ovh`)
      - traefik.http.routers.archipela-dock-https.entrypoints=websecure
      - traefik.http.routers.archipela-dock-https.rule=Host(`archipeluqac.otchi.ovh`)
      - traefik.http.routers.archipela-dock-https.tls=true
      - traefik.http.routers.archipela-dock-https.tls.certresolver=ovhcloud
      - traefik.http.services.archipela-dock.loadbalancer.server.port=80


networks:
  traefik_frontend:
    external: true
